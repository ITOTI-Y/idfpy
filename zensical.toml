# Documentation site. scripts/docs/build_site.py builds one copy per EnergyPlus
# version: it rewrites site_url and appends the generated object reference
# pages to the "Object reference" section of the navigation.
[project]
site_name = "idfpy"
site_description = "Type-safe Pydantic models for every EnergyPlus IDF object"
site_url = "https://itoti-y.github.io/idfpy/"
repo_url = "https://github.com/ITOTI-Y/idfpy"
repo_name = "ITOTI-Y/idfpy"
copyright = "MIT License · EnergyPlus is a trademark of the U.S. Department of Energy"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guides" = [
    "guides/files.md",
    "guides/navigation.md",
    "guides/validation.md",
    "guides/simulation.md",
    "guides/extensions.md",
    "guides/cli.md",
  ] },
  { "API" = [
    "api/idf.md",
    "api/models.md",
    "api/sim.md",
    "api/ext.md",
  ] },
  { "Object reference" = ["reference/index.md"] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/building-2"
repo = "simple/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "deep-orange"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "deep-orange"
toggle = { icon = "lucide/moon", name = "Switch to light mode" }

# The version selector reads ../versions.json, written by build_site.py.
[project.extra.version]
provider = "mike"
default = "latest"

[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://docs.pydantic.dev/latest/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
filters = ["!^_"]
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
